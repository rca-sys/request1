name: Quick Test
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: pip install pytest
      - run: pytest -k test_getattr_proxy_stream_follows_redirect
      - run: pytest tests/test_utils.py -k get_encoding --tb=long -v
